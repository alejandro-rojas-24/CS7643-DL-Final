# Experiment:
experiment: "flat" # "flat" "sine" "interpolated"
few_shot_examples_path: "examples/few_shot_data.yaml"
target_distance: 50.0
target_bounce_number: 3
target_tolerance: 1
max_iterations: 5

# LLM
model: "gpt-3.5-turbo" # "ollama/llama2" "google/gemini-2.0-flash-lite"
temperature: 0.5

# Simulation:
fps: 1000
gravity_y: -9.81
max_duration: 20
elasticity: 0.9
mass: 1.0
radius: 0.05

# Ground
x_min: -10.0
x_max: 1000
step: 0.1
friction: 0.8
amplitude: 0.25
frequency: 0.5
difficulty: 0.5
