services:
  ollama:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - 11434:11434
    volumes:
      - ollama-storage:/root/.ollama
      # For adding custom models on build
      - ./entrypoint.sh:/entrypoint.sh
    container_name: ollama
    pull_policy: always
    restart: unless-stopped
    entrypoint:
      - "/usr/bin/bash"
      - "/entrypoint.sh"
    environment:
      - OLLAMA_KEEP_ALIVE="30m"
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      retries: 2

volumes:
  ollama-storage: